; Konfigurasi PHP untuk runtime produksi MAXPORT.

memory_limit = 256M
max_execution_time = 60

upload_max_filesize = 20M
post_max_size = 21M

expose_php = Off
date.timezone = UTC

; OPcache: kode di dalam image tidak pernah berubah, jadi validasi timestamp dimatikan.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Laravel menulis lognya sendiri; error PHP diarahkan ke stderr container.
log_errors = On
error_log = /dev/stderr
display_errors = Off
